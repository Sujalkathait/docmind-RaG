version: '3.8'

services:
  docmind:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docmind-second-brain
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    volumes:
      # Persistent storage for second brain memory, wiki, documents, and vectors
      - ./data:/app/data
      - ./database:/app/database
      - ./chroma_db:/app/chroma_db
      - ./raw:/app/raw
      - ./wiki:/app/wiki
      - ./mem:/app/mem
      - ./output:/app/output
      - ./ctx:/app/ctx
      - ./models:/app/models
    restart: unless-stopped
